name: ai-po-intake
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: po_demo
      POSTGRES_PASSWORD: po_demo
      POSTGRES_DB: po_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_demo -d po_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
