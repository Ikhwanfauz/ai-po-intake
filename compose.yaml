name: ai-po-intake
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: po_demo
      POSTGRES_PASSWORD: po_demo
      POSTGRES_DB: po_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_demo -d po_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.7
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kuala_Lumpur
      TZ: Asia/Kuala_Lumpur
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/demo-workflows:ro
volumes:
  postgres_data:
  n8n_data:
